<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RACING LIMITS | VIVEK AI EDITION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #38bdf8; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #dist-box {
            position: absolute; top: 15px; left: 15px;
            background: rgba(15, 23, 42, 0.85); color: #22c55e;
            padding: 8px 14px; border-radius: 6px; font-weight: 800;
            font-size: 18px; border-left: 4px solid #22c55e;
        }
        #mirror {
            position: absolute; top: 15px; right: 20px; width: 230px; height: 68px;
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 50%, #475569 51%, #1e293b 100%);
            border: 5px solid #111827; border-radius: 35px; overflow: hidden;
        }
        #mirror-hud {
            position: absolute; bottom: 6px; right: 12px;
            background: rgba(0,0,0,0.8); color: #facc15; padding: 2px 8px;
            border-radius: 4px; font-weight: bold; font-size: 14px;
        }
        #cockpit { position: fixed; bottom: 0; left: 0; width: 100%; height: 34vh; pointer-events: none; z-index: 10; }
        #dashboard {
            position: absolute; bottom: 0; width: 100%; height: 22vh;
            background: linear-gradient(180deg, #1f2937 0%, #0f172a 100%);
            border-top: 6px solid #374151; border-radius: 40% 40% 0 0 / 25% 25% 0 0;
        }
        .gauge {
            position: absolute; bottom: 19vh; width: 54px; height: 54px;
            background: #f8fafc; border: 5px solid #111827; border-radius: 50%;
        }
        #g1 { left: 53%; } #g2 { left: 59%; }
        .needle {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 2px;
            background: #ef4444; transform-origin: left center; transform: rotate(-40deg);
        }
        #steering-wrap {
            position: absolute; bottom: -45px; left: 36%; width: 230px; height: 230px;
            transition: transform 0.08s ease-out;
        }
        #wheel {
            width: 100%; height: 100%; border: 22px solid #111827; border-radius: 50%;
            box-shadow: inset 0 0 12px #000, 0 8px 20px rgba(0,0,0,0.8); position: relative;
        }
        #wheel-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90px; height: 65px; background: #1f2937; border-radius: 16px;
            border: 3px solid #9ca3af; display: flex; align-items: center;
            justify-content: center; color: #00f3ff; font-weight: 900; font-size: 13px;
        }
        #side-mirror {
            position: absolute; bottom: 20vh; left: 10px; width: 130px; height: 75px;
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 52%, #475569 53%, #1e293b 100%);
            border: 8px solid #facc15; border-radius: 40px 15px 15px 40px;
        }
        #nitro-btn {
            position: absolute; bottom: 18vh; right: 25px; z-index: 20;
            background: rgba(15, 23, 42, 0.9); color: #38bdf8;
            border: 2px solid #38bdf8; padding: 10px 18px; border-radius: 8px;
            font-weight: 800; cursor: pointer; pointer-events: auto;
        }
        #nitro-btn.active { background: #38bdf8; color: #000; box-shadow: 0 0 20px #38bdf8; }
        #controls-tip {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.65); color: #fff; padding: 6px 16px;
            border-radius: 20px; font-size: 13px;
        }
    </style>
</head>
<body>
    <canvas id="roadCanvas"></canvas>
    <div id="dist-box">▲ <span id="km">00.00</span> KM</div>
    <div id="controls-tip">🎮 <b>W / Up</b>: Race | <b>A / D (Left/Right)</b>: Steer | <b>Shift / Space</b>: N2O Nitro</div>
    <div id="mirror"><div id="mirror-hud">S1 | <span id="speed">040</span> KMH</div></div>
    <button id="nitro-btn" onmousedown="nitro=true" onmouseup="nitro=false">⚡ N2O NITRO</button>

    <div id="cockpit">
        <div id="side-mirror"></div>
        <div id="dashboard"></div>
        <div class="gauge" id="g1"><div class="needle" id="n1"></div></div>
        <div class="gauge" id="g2"><div class="needle" id="n2"></div></div>
        <div id="steering-wrap"><div id="wheel"><div id="wheel-hub">VIVEK</div></div></div>
    </div>

    <script>
        const canvas = document.getElementById("roadCanvas");
        const ctx = canvas.getContext("2d");
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener("resize", resize); resize();

        let speed = 5, dist = 0, playerX = 0.25, steerAngle = 0, nitro = false, offset = 0;
        const keys = {};
        window.addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "ShiftLeft" || e.code === "Space") nitro = true; });
        window.addEventListener("keyup", e => { keys[e.code] = false; if (e.code === "ShiftLeft" || e.code === "Space") nitro = false; });

        const cars = [
            { lane: -0.6, z: 0.2, color: "#f8fafc" },
            { lane: 0.2, z: 0.5, color: "#ef4444" },
            { lane: -0.2, z: 0.8, color: "#3b82f6" },
            { lane: 0.65, z: 0.35, color: "#f59e0b" }
        ];

        function loop() {
            const w = canvas.width, h = canvas.height, horizon = h * 0.44;
            const target = nitro ? 16 : (keys["KeyW"] || keys["ArrowUp"]) ? 11 : (keys["KeyS"] || keys["ArrowDown"]) ? 2.5 : 5.5;
            speed += (target - speed) * 0.05;
            document.getElementById("nitro-btn").classList.toggle("active", nitro);

            if ((keys["KeyA"] || keys["ArrowLeft"]) && playerX > -0.8) { playerX -= 0.018; steerAngle = -32; }
            else if ((keys["KeyD"] || keys["ArrowRight"]) && playerX < 0.8) { playerX += 0.018; steerAngle = 32; }
            else { steerAngle *= 0.85; }
            document.getElementById("steering-wrap").style.transform = `rotate(${steerAngle}deg)`;

            // Sky & Sun
            const sky = ctx.createLinearGradient(0, 0, 0, horizon);
            sky.addColorStop(0, "#0284c7"); sky.addColorStop(1, "#bae6fd");
            ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);
            ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(w * 0.28, h * 0.16, 36, 0, Math.PI * 2); ctx.fill();

            // Grass
            ctx.fillStyle = "#3f8f29"; ctx.fillRect(0, horizon, w, h - horizon);

            // 3D Perspective Road
            const centerTop = w * 0.5 - playerX * 90;
            const centerBot = w * 0.5 - playerX * 360;
            const roadTopW = w * 0.07, roadBotW = w * 0.78;

            ctx.fillStyle = "#334155";
            ctx.beginPath();
            ctx.moveTo(centerTop - roadTopW, horizon); ctx.lineTo(centerTop + roadTopW, horizon);
            ctx.lineTo(centerBot + roadBotW, h); ctx.lineTo(centerBot - roadBotW, h);
            ctx.closePath(); ctx.fill();

            // Guardrails
            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(centerTop - roadTopW, horizon); ctx.lineTo(centerBot - roadBotW, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(centerTop + roadTopW, horizon); ctx.lineTo(centerBot + roadBotW, h); ctx.stroke();

            // Double Yellow Center Line
            ctx.strokeStyle = "#facc15"; ctx.lineWidth = 4;
            [-4, 4].forEach(dx => {
                ctx.beginPath(); ctx.moveTo(centerTop + dx * 0.2, horizon); ctx.lineTo(centerBot + dx, h); ctx.stroke();
            });

            // Moving Strips, Trees & Solar Panels
            offset = (offset + speed * 0.012) % 1;
            for (let i = 0; i < 12; i++) {
                let p = ((i / 12) + offset) % 1;
                let y = horizon + Math.pow(p, 2.1) * (h - horizon);
                let scale = Math.pow(p, 1.5);
                let cx = centerTop + (centerBot - centerTop) * scale;
                let rw = roadTopW + (roadBotW - roadTopW) * scale;

                // White Lane Dashes
                ctx.fillStyle = "#fff";
                ctx.fillRect(cx - rw * 0.5, y, 4 * scale + 1, 18 * scale);
                ctx.fillRect(cx + rw * 0.5, y, 4 * scale + 1, 18 * scale);

                // Solar Panels on Right
                ctx.fillStyle = "#1d4ed8";
                ctx.fillRect(cx + rw + 12 * scale, y - 16 * scale, 55 * scale, 14 * scale);

                // Trees on Left
                ctx.fillStyle = i % 2 === 0 ? "#15803d" : "#991b1b";
                ctx.beginPath(); ctx.arc(cx - rw - 35 * scale, y - 22 * scale, 22 * scale, 0, Math.PI * 2); ctx.fill();
            }

            // Traffic Cars
            cars.forEach(c => {
                c.z += speed * 0.0045;
                if (c.z > 1) { c.z = 0.02; c.lane = [-0.65, -0.22, 0.22, 0.65][Math.floor(Math.random() * 4)]; }
                let scale = Math.pow(c.z, 1.7);
                let y = horizon + Math.pow(c.z, 2.1) * (h - horizon);
                let cx = centerTop + (centerBot - centerTop) * scale;
                let rw = roadTopW + (roadBotW - roadTopW) * scale;
                let carX = cx + c.lane * rw;
                let cw = 75 * scale, ch = 46 * scale;

                ctx.fillStyle = c.color;
                ctx.fillRect(carX - cw / 2, y - ch, cw, ch);
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(carX - cw * 0.38, y - ch * 0.85, cw * 0.76, ch * 0.35);

                if (c.z > 0.85 && Math.abs(c.lane - playerX) < 0.28) { speed = 2; c.z = 0.02; }
            });

            dist += speed * 0.002;
            const kmh = Math.round(speed * 15 + 30);
            document.getElementById("km").textContent = dist.toFixed(2).padStart(5, "0");
            document.getElementById("speed").textContent = String(kmh).padStart(3, "0");
            document.getElementById("n1").style.transform = `rotate(${-40 + kmh * 0.9}deg)`;
            document.getElementById("n2").style.transform = `rotate(${-40 + kmh * 0.7}deg)`;
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
