<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RACING LIMITS | VIVEK AI EDITION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #38bdf8; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; }
        #dist-box {
            position: absolute; top: 15px; left: 15px;
            background: rgba(15, 23, 42, 0.85); color: #22c55e;
            padding: 8px 14px; border-radius: 6px; font-weight: 800;
            font-size: 18px; border-left: 4px solid #22c55e;
        }
        #mirror {
            position: absolute; top: 15px; right: 20px; width: 230px; height: 68px;
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 50%, #475569 51%, #1e293b 100%);
            border: 5px solid #111827; border-radius: 35px; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        #mirror-hud {
            position: absolute; bottom: 6px; right: 12px;
            background: rgba(0,0,0,0.8); color: #facc15; padding: 2px 8px;
            border-radius: 4px; font-weight: bold; font-size: 14px;
        }
        #cockpit { position: fixed; bottom: 0; left: 0; width: 100%; height: 34vh; pointer-events: none; z-index: 10; }
        #dashboard {
            position: absolute; bottom: 0; width: 100%; height: 22vh;
            background: linear-gradient(180deg, #1f2937 0%, #0f172a 100%);
            border-top: 6px solid #374151; border-radius: 40% 40% 0 0 / 25% 25% 0 0;
        }
        .gauge {
            position: absolute; bottom: 19vh; width: 54px; height: 54px;
            background: #f8fafc; border: 5px solid #111827; border-radius: 50%;
        }
        #g1 { left: 53%; } #g2 { left: 59%; }
        .needle {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 2px;
            background: #ef4444; transform-origin: left center; transform: rotate(-40deg);
        }
        #steering-wrap {
            position: absolute; bottom: -45px; left: 36%; width: 230px; height: 230px;
            transition: transform 0.08s ease-out;
        }
        #wheel {
            width: 100%; height: 100%; border: 22px solid #111827; border-radius: 50%;
            box-shadow: inset 0 0 12px #000, 0 8px 20px rgba(0,0,0,0.8); position: relative;
        }
        #wheel-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90px; height: 65px; background: #1f2937; border-radius: 16px;
            border: 3px solid #9ca3af; display: flex; align-items: center;
            justify-content: center; color: #00f3ff; font-weight: 900; font-size: 13px;
        }
        #side-mirror {
            position: absolute; bottom: 20vh; left: 10px; width: 130px; height: 75px;
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 52%, #475569 53%, #1e293b 100%);
            border: 8px solid #facc15; border-radius: 40px 15px 15px 40px;
        }
        #nitro-btn {
            position: absolute; bottom: 18vh; right: 25px; z-index: 20;
            background: rgba(15, 23, 42, 0.9); color: #38bdf8;
            border: 2px solid #38bdf8; padding: 10px 18px; border-radius: 8px;
            font-weight: 800; cursor: pointer; pointer-events: auto;
        }
        #nitro-btn.active { background: #38bdf8; color: #000; box-shadow: 0 0 20px #38bdf8; }
        #controls-tip {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.65); color: #fff; padding: 6px 16px;
            border-radius: 20px; font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="dist-box">▲ <span id="km">00.00</span> KM</div>
    <div id="controls-tip">🎮 <b>W / Up</b>: Race | <b>A / D (Left/Right)</b>: Steer | <b>Shift / Space</b>: N2O Nitro</div>
    <div id="mirror"><div id="mirror-hud">S1 | <span id="speed">040</span> KMH</div></div>
    <button id="nitro-btn" onmousedown="nitro=true" onmouseup="nitro=false">⚡ N2O NITRO</button>

    <div id="cockpit">
        <div id="side-mirror"></div>
        <div id="dashboard"></div>
        <div class="gauge" id="g1"><div class="needle" id="n1"></div></div>
        <div class="gauge" id="g2"><div class="needle" id="n2"></div></div>
        <div id="steering-wrap"><div id="wheel"><div id="wheel-hub">VIVEK</div></div></div>
    </div>

    <script src="https://cloudflare.com"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5ec8f8);
        scene.fog = new THREE.Fog(0x93d9fa, 40, 180);

        const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 250);
        camera.position.set(0, 1.45, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(10, 30, 10);
        scene.add(sun, new THREE.AmbientLight(0xffffff, 0.7));

        const grass = new THREE.Mesh(new THREE.PlaneGeometry(300, 400), new THREE.MeshLambertMaterial({ color: 0x3f8f29 }));
        grass.rotation.x = -Math.PI / 2; scene.add(grass);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 400), new THREE.MeshLambertMaterial({ color: 0x334155 }));
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02; scene.add(road);

        const yellowLine = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 400), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
        yellowLine.rotation.x = -Math.PI / 2; yellowLine.position.y = 0.04; scene.add(yellowLine);

        const props = [];
        for (let z = -180; z < 20; z += 12) {
            [-7.3, 7.3].forEach(x => {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 11.8), new THREE.MeshLambertMaterial({ color: 0xcbd5e1 }));
                rail.position.set(x, 0.4, z); scene.add(rail); props.push(rail);
            });
            const solar = new THREE.Mesh(new THREE.BoxGeometry(5, 0.15, 7), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }));
            solar.position.set(12, 1.3, z); solar.rotation.z = 0.45; scene.add(solar); props.push(solar);

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 2), new THREE.MeshLambertMaterial({ color: 0x78350f }));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.8), new THREE.MeshLambertMaterial({ color: z % 24 === 0 ? 0x991b1b : 0x15803d }));
            leaves.position.y = 2.2;
            const tree = new THREE.Group(); tree.add(trunk, leaves);
            tree.position.set(-12 - (Math.abs(z) % 6), 1, z); scene.add(tree); props.push(tree);
        }

        const traffic = [];
        const lanes = [-4.8, -1.8, 1.8, 4.8];
        const carColors = [0xf8fafc, 0xef4444, 0x3b82f6, 0xf59e0b];
        for (let i = 0; i < 7; i++) {
            const car = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.9, 4), new THREE.MeshLambertMaterial({ color: carColors[i % 4] }));
            body.position.y = 0.65;
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.65, 2.1), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
            cabin.position.set(0, 1.35, -0.2);
            car.add(body, cabin); car.position.set(lanes[i % 4], 0, -25 - i * 26);
            scene.add(car); traffic.push(car);
        }

        let speed = 0.7, dist = 0, playerX = 1.8, steerAngle = 0, nitro = false;
        const keys = {};
        window.addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "ShiftLeft" || e.code === "Space") nitro = true; });
        window.addEventListener("keyup", e => { keys[e.code] = false; if (e.code === "ShiftLeft" || e.code === "Space") nitro = false; });

        function animate() {
            requestAnimationFrame(animate);
            const targetSpeed = nitro ? 1.85 : (keys["KeyW"] || keys["ArrowUp"]) ? 1.35 : (keys["KeyS"] || keys["ArrowDown"]) ? 0.35 : 0.75;
            speed += (targetSpeed - speed) * 0.05;
            document.getElementById("nitro-btn").classList.toggle("active", nitro);

            if ((keys["KeyA"] || keys["ArrowLeft"]) && playerX > -5.5) { playerX -= 0.11; steerAngle = -32; }
            else if ((keys["KeyD"] || keys["ArrowRight"]) && playerX < 5.5) { playerX += 0.11; steerAngle = 32; }
            else { steerAngle *= 0.85; }

            camera.position.x = playerX;
            document.getElementById("steering-wrap").style.transform = `rotate(${steerAngle}deg)`;

            props.forEach(p => { p.position.z += speed; if (p.position.z > 15) p.position.z -= 200; });
            traffic.forEach(car => {
                car.position.z += speed * 0.65;
                if (car.position.z > 10) { car.position.z = -170; car.position.x = lanes[Math.floor(Math.random() * 4)]; }
                if (Math.abs(car.position.z - 3.5) < 2.2 && Math.abs(car.position.x - playerX) < 1.5) { speed = 0.2; car.position.z = -170; }
            });

            dist += speed * 0.015;
            const kmh = Math.round(speed * 115);
            document.getElementById("km").textContent = dist.toFixed(2).padStart(5, "0");
            document.getElementById("speed").textContent = String(kmh).padStart(3, "0");
            document.getElementById("n1").style.transform = `rotate(${-40 + kmh * 1.1}deg)`;
            document.getElementById("n2").style.transform = `rotate(${-40 + kmh * 0.8}deg)`;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
